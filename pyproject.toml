[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memoria-document-reader"
version = "0.1.0"
description = "MemoriaOS Document Reader Agent: modular multi-format document extraction and structural normalization service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "PyMuPDF>=1.25.0,<2.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.13,<1.0.0",
    "Pillow>=11.0.0,<12.0.0",
]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "httpx>=0.28.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.14.0,<2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
