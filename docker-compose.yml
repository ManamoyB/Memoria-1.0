services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: memoria
      POSTGRES_DB: memoria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - memoria_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoria -d memoria"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.16.2}
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - memoria_qdrant:/qdrant/storage
    restart: unless-stopped
volumes:
  memoria_postgres:
  memoria_qdrant:
